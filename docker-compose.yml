# Service topology — run each service locally with `./gradlew :order-service:bootRun` etc.
# Kafka infrastructure is introduced in the simple-solution branch.
services:
  order-service:
    image: eclipse-temurin:21-jre
    working_dir: /app
    volumes:
      - ./order-service/build/libs:/app
    command: java -jar order-service-0.0.1-SNAPSHOT.jar
    ports:
      - "8080:8080"
    environment:
      SERVICES_INVENTORY_URL: http://inventory-service:8081
      SERVICES_NOTIFICATION_URL: http://notification-service:8082
    depends_on:
      - inventory-service
      - notification-service

  inventory-service:
    image: eclipse-temurin:21-jre
    working_dir: /app
    volumes:
      - ./inventory-service/build/libs:/app
    command: java -jar inventory-service-0.0.1-SNAPSHOT.jar
    ports:
      - "8081:8081"

  notification-service:
    image: eclipse-temurin:21-jre
    working_dir: /app
    volumes:
      - ./notification-service/build/libs:/app
    command: java -jar notification-service-0.0.1-SNAPSHOT.jar
    ports:
      - "8082:8082"
